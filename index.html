<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<title>IRON LOG</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0D0D0D;color:#E8E8E8;font-family:-apple-system,'SF Pro Display','Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding:16px;padding-top:env(safe-area-inset-top,16px)}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-top:8px}
.logo{font-size:22px;font-weight:800;letter-spacing:3px;color:#fff}
.week-badge{background:#1A1A1A;border:1px solid #333;border-radius:20px;padding:6px 14px;font-size:13px;color:#aaa}
.section-label{font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.workout-grid{display:flex;gap:10px;margin-bottom:20px}
.workout-card{flex:1;background:#1A1A1A;border:none;border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer}
.workout-card:active{transform:scale(0.96)}
.wc-icon{font-size:24px;margin-bottom:6px}
.wc-name{font-size:12px;font-weight:600;color:#ddd;margin-bottom:4px}
.wc-status{font-size:20px;margin-top:4px;font-weight:700}
.next-btn{width:100%;border:none;border-radius:16px;padding:20px;display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:28px}
.next-btn:active{transform:scale(0.98)}
.next-btn-icon{font-size:28px}
.next-btn-text{font-size:18px;font-weight:700;color:#fff;flex:1;text-align:left}
.next-btn-arrow{font-size:22px;color:rgba(255,255,255,0.7)}
.history-btn{width:100%;background:#1A1A1A;border:1px solid #2A2A2A;border-radius:14px;padding:16px;color:#aaa;font-size:15px;cursor:pointer;margin-top:4px}
.back-btn{background:none;border:none;color:#888;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:8px}
.session-header{padding-bottom:14px;margin-bottom:16px}
.session-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:12px}
.progress-outer{height:6px;background:#2A2A2A;border-radius:3px;overflow:hidden;margin-bottom:6px}
.progress-inner{height:100%;border-radius:3px;transition:width 0.3s ease}
.progress-text{font-size:12px;color:#666}
.exercise-list{display:flex;flex-direction:column;gap:12px;padding-bottom:80px}
.exercise-card{background:#1A1A1A;border-radius:14px;padding:14px}
.ex-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ex-name{font-size:15px;font-weight:600;color:#fff}
.ex-muscle{font-size:12px;color:#666;margin-top:2px}
.last-weight{font-size:11px;color:#888;background:#252525;padding:4px 8px;border-radius:8px}
.sets-grid{display:flex;flex-direction:column;gap:6px}
.set-row{display:flex;align-items:center;gap:8px}
.set-num{width:22px;font-size:13px;color:#555;font-weight:600;text-align:center}
.set-input{flex:1;background:#252525;border:1px solid #333;border-radius:8px;padding:10px;color:#fff;font-size:15px;text-align:center;outline:none}
.set-input:focus{border-color:#555}
.check-ind{width:32px;height:32px;border-radius:8px;border:1.5px solid #333;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;opacity:0.8}
.check-ind.done{color:#fff;opacity:1}
.finish-btn{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;border:none;border-radius:14px;padding:18px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;z-index:10}
.done-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh}
.done-emoji{font-size:64px;margin-bottom:16px}
.done-title{font-size:24px;font-weight:700;color:#fff;margin-bottom:8px}
.done-subtitle{font-size:16px;color:#888;margin-bottom:32px}
.done-btn{background:#27AE60;border:none;border-radius:14px;padding:16px 40px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.history-header{margin-bottom:20px}
.history-title{font-size:20px;font-weight:700;color:#fff;margin-top:8px}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-card{background:#1A1A1A;border-radius:12px;padding:14px}
.history-card-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;color:#ddd;margin-bottom:6px}
.history-date{font-size:12px;color:#666}
.history-detail{font-size:12px;color:#888;line-height:1.5}
.history-ex-list{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.history-ex-item{border-top:1px solid #252525;padding-top:8px}
.history-ex-name{font-size:13px;font-weight:600;color:#ccc;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.history-delta{font-size:11px;font-weight:700}
.history-sets-row{display:flex;flex-wrap:wrap;gap:5px}
.history-set-badge{background:#252525;border-radius:6px;padding:4px 8px;font-size:11px;color:#aaa;white-space:nowrap}
.empty-history{text-align:center;color:#555;padding:40px 0;font-size:15px}
.loading{text-align:center;padding:60px 0;color:#666;font-size:16px}
</style>
</head>
<body>
<div id="app"><div class="loading">Загрузка...</div></div>
<script>
const WORKOUTS={
A:{name:"Грудь + Трицепс",icon:"💪",color:"#E74C3C",exercises:[
{id:"a1",name:"Жим штанги лёжа",sets:4,reps:"10",muscle:"Грудь"},
{id:"a2",name:"Разводка гантелей лёжа",sets:3,reps:"10-12",muscle:"Грудь"},
{id:"a3",name:"Жим гантелей наклон 30°",sets:3,reps:"10",muscle:"Верх груди"},
{id:"a4",name:"Французский жим лёжа",sets:3,reps:"10-12",muscle:"Трицепс"},
{id:"a5",name:"Тяга блока вниз узкий хват",sets:3,reps:"12",muscle:"Трицепс"},
{id:"a6",name:"Беговая дорожка",sets:1,reps:"8-10 мин",muscle:"Кардио",cardio:true}
]},
B:{name:"Спина + Бицепс",icon:"🏋️",color:"#2980B9",exercises:[
{id:"b1",name:"Тяга горизонт. блока к поясу",sets:4,reps:"10-12",muscle:"Спина"},
{id:"b2",name:"Тяга верт. блока к груди",sets:4,reps:"10",muscle:"Широчайшие"},
{id:"b3",name:"Тяга гантели одной рукой",sets:3,reps:"10",muscle:"Широчайшие"},
{id:"b4",name:"Гиперэкстензия без веса",sets:3,reps:"15",muscle:"Разгибатели"},
{id:"b5",name:"Подъём штанги на бицепс",sets:3,reps:"10-12",muscle:"Бицепс"},
{id:"b6",name:"Молотковые сгибания",sets:3,reps:"10",muscle:"Бицепс"},
{id:"b7",name:"Беговая дорожка",sets:1,reps:"8-10 мин",muscle:"Кардио",cardio:true}
]},
C:{name:"Плечи + Пресс",icon:"🔥",color:"#27AE60",exercises:[
{id:"c1",name:"Жим гантелей сидя",sets:4,reps:"10",muscle:"Плечи"},
{id:"c2",name:"Разводка гантелей в стороны",sets:3,reps:"12",muscle:"Ср. дельты"},
{id:"c3",name:"Тяга штанги к подбородку",sets:3,reps:"10",muscle:"Дельты"},
{id:"c4",name:"Разводка в наклоне",sets:3,reps:"12",muscle:"Задн. дельты"},
{id:"c5",name:"Скручивания лёжа",sets:3,reps:"15-20",muscle:"Пресс"},
{id:"c6",name:"Планка",sets:3,reps:"30-40 сек",muscle:"Кор"},
{id:"c7",name:"Подъём ног в висе",sets:3,reps:"10-12",muscle:"Нижний пресс"},
{id:"c8",name:"Беговая дорожка",sets:1,reps:"8-10 мин",muscle:"Кардио",cardio:true}
]}
};
const SKEY="iron-log-v2";
const allExDefs=[...WORKOUTS.A.exercises,...WORKOUTS.B.exercises,...WORKOUTS.C.exercises];
let data={sessions:[],startDate:today()};
let view="home";
let activeType=null;
let sessionData={};

function today(){return new Date().toISOString().split("T")[0]}
function fmtDate(s){const d=new Date(s+"T12:00:00");const dd=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];const mm=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];return dd[d.getDay()]+", "+d.getDate()+" "+mm[d.getMonth()]}
function load(){try{const s=localStorage.getItem(SKEY);if(s)data=JSON.parse(s)}catch(e){}}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(data))}catch(e){}}
function nextType(){if(!data.sessions.length)return"A";const l=data.sessions[data.sessions.length-1].type;return l==="A"?"B":l==="B"?"C":"A"}
function weekNum(){const s=new Date(data.startDate+"T12:00:00");const n=new Date();return Math.min(Math.max(Math.floor((n-s)/(7*864e5))+1,1),4)}
function lastWeight(exId){for(let i=data.sessions.length-1;i>=0;i--){const s=data.sessions[i];if(s.exercises[exId]){const st=s.exercises[exId].sets.filter(x=>x.weight).pop();if(st)return st.weight}}return null}

function render(){
const app=document.getElementById("app");
if(view==="home")renderHome(app);
else if(view==="session")renderSession(app);
else if(view==="done")renderDone(app);
else if(view==="history")renderHistory(app);
}

function renderHome(el){
const next=nextType();const w=WORKOUTS[next];const wk=weekNum();
const now=Date.now();const weekAgo=now-7*864e5;
const done={A:false,B:false,C:false};
data.sessions.forEach(s=>{if(s.ts>weekAgo)done[s.type]=true});
let h=`<div class="header"><div class="logo">IRON LOG</div><div class="week-badge">Неделя ${wk}/4</div></div>`;
h+=`<div class="section-label">Тренировки на этой неделе</div><div class="workout-grid">`;
for(const[k,v]of Object.entries(WORKOUTS)){
h+=`<div class="workout-card" style="border-top:3px solid ${v.color}" onclick="startWorkout('${k}')">
<div class="wc-icon">${v.icon}</div><div class="wc-name">${v.name}</div>
<div class="wc-status" style="color:${done[k]?'#27AE60':'#555'}">${done[k]?'✓':'○'}</div></div>`;
}
h+=`</div><div class="section-label">Следующая тренировка</div>`;
h+=`<div class="next-btn" style="background:${w.color}" onclick="startWorkout('${next}')">
<span class="next-btn-icon">${w.icon}</span><span class="next-btn-text">${w.name}</span><span class="next-btn-arrow">→</span></div>`;
h+=`<div class="history-btn" onclick="goHistory()">📋 История тренировок</div>`;
el.innerHTML=h;
}

function renderSession(el){
const wo=WORKOUTS[activeType];
let totalS=0,doneS=0;
for(const ex of wo.exercises){const sd=sessionData[ex.id];totalS+=sd.sets.length;doneS+=sd.sets.filter(s=>s.done).length}
const pct=totalS?Math.round(doneS/totalS*100):0;
let h=`<div class="session-header" style="border-bottom:3px solid ${wo.color}">
<div class="back-btn" onclick="goHome()">← Назад</div>
<div class="session-title">${wo.icon} ${wo.name}</div>
<div class="progress-outer"><div class="progress-inner" style="width:${pct}%;background:${wo.color}"></div></div>
<div class="progress-text">${doneS}/${totalS} подходов</div></div>`;
h+=`<div class="exercise-list">`;
for(const ex of wo.exercises){
const lw=lastWeight(ex.id);const unit=ex.cardio?"км/ч":"кг";const runit=ex.cardio?"мин":"раз";
h+=`<div class="exercise-card"><div class="ex-header"><div><div class="ex-name">${ex.name}</div>
<div class="ex-muscle">${ex.muscle} · ${ex.sets}×${ex.reps}</div></div>`;
if(lw)h+=`<div class="last-weight">Прошлый: ${lw} ${unit}</div>`;
h+=`</div><div class="sets-grid">`;
sessionData[ex.id].sets.forEach((s,i)=>{
const isDone=s.done;
h+=`<div class="set-row"><div class="set-num">${i+1}</div>
<input type="number" inputmode="decimal" placeholder="${unit}" value="${s.weight}" class="set-input" onchange="updSet('${ex.id}',${i},'weight',this.value)">
<input type="number" inputmode="numeric" placeholder="${runit}" value="${s.reps}" class="set-input" onchange="updSet('${ex.id}',${i},'reps',this.value)">
<div class="check-ind${isDone?' done':''}" style="background:${isDone?wo.color:'transparent'};border-color:${isDone?wo.color:'#333'};color:${isDone?'#fff':'#333'}">${isDone?'✓':'○'}</div></div>`;
});
h+=`</div></div>`;
}
h+=`</div>`;
const canFinish=doneS>0;
h+=`<button class="finish-btn" style="background:${doneS===totalS?wo.color:'#555'};opacity:${canFinish?1:0.5}" ${canFinish?'':'disabled'} onclick="finishWorkout()">Завершить тренировку</button>`;
el.innerHTML=h;
}

function renderDone(el){
const wo=WORKOUTS[activeType];
el.innerHTML=`<div class="done-screen"><div class="done-emoji">🎯</div>
<div class="done-title">Тренировка записана!</div>
<div class="done-subtitle">${wo.icon} ${wo.name}</div>
<button class="done-btn" onclick="goHome()">На главную</button></div>`;
}

function renderHistory(el){
const sessions=[...data.sessions].reverse();
let h=`<div class="history-header"><div class="back-btn" onclick="goHome()">← Назад</div>
<div class="history-title">История тренировок</div></div>`;
if(!sessions.length){h+=`<div class="empty-history">Пока нет записей</div>`;el.innerHTML=h;return}
h+=`<div class="history-list">`;
for(const s of sessions){
const w=WORKOUTS[s.type];
let totalS=0,doneS=0;
for(const ex of Object.values(s.exercises)){totalS+=ex.sets.length;doneS+=ex.sets.filter(st=>st.done).length}
h+=`<div class="history-card" style="border-left:4px solid ${w.color}">
<div class="history-card-top"><span>${w.icon} ${w.name}</span><span class="history-date">${fmtDate(s.date)}</span></div>
<div class="history-detail">${doneS}/${totalS} подходов</div><div class="history-ex-list">`;
for(const[exId,exData]of Object.entries(s.exercises)){
const exDef=allExDefs.find(e=>e.id===exId);
const exName=exDef?exDef.name:exId;
const isCardio=exDef&&exDef.cardio;
const wUnit=isCardio?"км/ч":"кг";const rUnit=isCardio?"мин":"×";
const doneSetsEx=exData.sets.filter(st=>st.done);
if(!doneSetsEx.length)continue;
let prevMax=null;
for(let j=data.sessions.length-1;j>=0;j--){const ps=data.sessions[j];if(ps.ts>=s.ts)continue;if(ps.exercises[exId]){const pSets=ps.exercises[exId].sets.filter(st=>st.weight);if(pSets.length){prevMax=Math.max(...pSets.map(st=>Number(st.weight)||0));break}}}
const curMax=Math.max(...exData.sets.map(st=>Number(st.weight)||0));
let delta=null;if(prevMax!==null&&curMax>0)delta=curMax-prevMax;
h+=`<div class="history-ex-item"><div class="history-ex-name">${exName}`;
if(delta!==null&&delta!==0)h+=` <span class="history-delta" style="color:${delta>0?'#27AE60':'#E74C3C'}">${delta>0?'+'+delta:delta} ${wUnit}</span>`;
h+=`</div><div class="history-sets-row">`;
exData.sets.forEach(st=>{
h+=`<div class="history-set-badge" style="opacity:${st.done?1:0.35}">${st.weight?st.weight+wUnit:'—'}${st.reps?' '+rUnit+st.reps:''}</div>`;
});
h+=`</div></div>`;
}
h+=`</div></div>`;
}
h+=`</div>`;
el.innerHTML=h;
}

function startWorkout(type){
activeType=type;const wo=WORKOUTS[type];sessionData={};
wo.exercises.forEach(ex=>{sessionData[ex.id]={sets:Array.from({length:ex.sets},()=>({weight:"",reps:"",done:false}))}});
view="session";render();
}
function updSet(exId,idx,field,val){
sessionData[exId].sets[idx][field]=val;
const s=sessionData[exId].sets[idx];
s.done=s.weight!==""&&s.reps!=="";
render();
}
function finishWorkout(){
data.sessions.push({date:today(),type:activeType,exercises:JSON.parse(JSON.stringify(sessionData)),ts:Date.now()});
save();view="done";render();
}
function goHome(){view="home";activeType=null;render()}
function goHistory(){view="history";render()}

load();render();
</script>
</body>
</html>
